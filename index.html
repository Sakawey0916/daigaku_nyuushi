const origUrl = (id, ans) => 'https://mikiotaniguchi.com/image/' + id.slice(0,2) + '/' + id + (ans ? 's' : '') + '.pdf';

function filtered(){
  let r = DATA.filter(p =>
    (!state.field || p[4] === state.field) &&
    (!state.topic || p[3] === state.topic) &&
    (!state.course || p[5] === state.course) &&
    (!state.decade || Math.floor(p[1]/10)*10 === +state.decade) &&
    (!state.q || (p[2] + p[3] + p[4]).includes(state.q)));
  r.sort((a,b) => state.sort === 'desc' ? (b[1]-a[1] || a[2].localeCompare(b[2],'ja')) : (a[1]-b[1] || a[2].localeCompare(b[2],'ja')));
  return r;
}
function renderFields(){
  const counts = {};
  DATA.forEach(p => counts[p[4]] = (counts[p[4]]||0)+1);
  $('fields').innerHTML = '<button class="fitem' + (state.field===''?' on':'') + '" data-f="">すべて<span class="n">' + DATA.length + '</span></button>' +
    FIELDS.filter(f => counts[f]).map(f => '<button class="fitem' + (state.field===f?' on':'') + '" data-f="' + f + '">' + f + '<span class="n">' + counts[f] + '</span></button>').join('');
  document.querySelectorAll('#fields .fitem').forEach(b => b.onclick = () => { state.field = b.dataset.f; state.topic=''; state.shown=100; renderAll(); });
}
function renderTopics(){
  const base = state.field ? DATA.filter(p => p[4]===state.field) : DATA;
  const counts = {};
  base.forEach(p => counts[p[3]] = (counts[p[3]]||0)+1);
  const ts = Object.keys(counts).sort((a,b) => counts[b]-counts[a]);
  $('topics').innerHTML = '<button class="titem' + (state.topic===''?' on':'') + '" data-t="">すべて<span class="n">' + base.length + '</span></button>' +
    ts.map(t => '<button class="titem' + (state.topic===t?' on':'') + '" data-t="' + t + '">' + t + '<span class="n">' + counts[t] + '</span></button>').join('');
  document.querySelectorAll('#topics .titem').forEach(b => b.onclick = () => { state.topic = b.dataset.t; state.shown=100; renderList(); markOn(); });
}
function markOn(){
  document.querySelectorAll('#topics .titem').forEach(b => b.classList.toggle('on', b.dataset.t === state.topic));
  document.querySelectorAll('#fields .fitem').forEach(b => b.classList.toggle('on', b.dataset.f === state.field));
}
function openPdf(p){
  $('mtitle').textContent = p[1] + '年 ' + p[2] + '（' + p[3] + '）';
  $('mtab').href = ourUrl(p);
  $('mframe').src = 'about:blank';
  setTimeout(() => { $('mframe').src = ourUrl(p); }, 30);
  $('modal').classList.add('open');
}
function renderList(){
  const r = filtered();
  $('count').textContent = r.length.toLocaleString() + ' 問' + (state.field || state.topic || state.q || state.decade || state.course ? '（絞り込み中）' : '');
  const show = r.slice(0, state.shown);
  $('list').innerHTML = show.map((p, i) =>
    '<div class="card"><span class="yr">' + p[1] + '</span><span class="univ">' + p[2] + '</span>' +
    '<span class="chip">' + p[3] + '</span><span class="chip f">' + p[4] + '</span>' +
    (p[5] ? '<span class="chip">' + p[5] + '</span>' : '') +
    '<span class="sp"></span>' +
    '<button class="pbtn q" data-i="' + i + '">PDFを開く</button>' +
    '<span class="orig">谷口サイト：<a href="' + origUrl(p[0], false) + '" target="_blank" rel="noopener">元の問題</a> / <a href="' + origUrl(p[0], true) + '" target="_blank" rel="noopener">元の解答</a></span>' +
    '</div>').join('') || '<p style="color:var(--muted);padding:12px">該当する問題がありません。</p>';
  document.querySelectorAll('#list .pbtn').forEach(b => b.onclick = () => openPdf(show[+b.dataset.i]));
  $('more').style.display = r.length > state.shown ? 'block' : 'none';
}
function renderAll(){ renderFields(); renderTopics(); renderList(); }

(function init(){
  const decades = [...new Set(DATA.map(p => Math.floor(p[1]/10)*10))].sort((a,b) => b-a);
  $('decade').innerHTML += decades.map(d => '<option value="' + d + '">' + d + '年代</option>').join('');
  const courses = [...new Set(DATA.map(p => p[5]).filter(Boolean))];
  const order = ['数学1','数学2','数学3','数学A','数学B','数学C','旧課程','共通テスト形式','私大マーク式'];
  courses.sort((a,b) => order.indexOf(a) - order.indexOf(b));
  $('course').innerHTML += courses.map(c => '<option>' + c + '</option>').join('');
  $('q').oninput = e => { state.q = e.target.value.trim(); state.shown = 100; renderList(); };
  $('decade').onchange = e => { state.decade = e.target.value; state.shown = 100; renderList(); };
  $('course').onchange = e => { state.course = e.target.value; state.shown = 100; renderList(); };
  $('sort').onchange = e => { state.sort = e.target.value; state.shown = 100; renderList(); };
  $('more').onclick = () => { state.shown += 100; renderList(); };
  $('reset').onclick = () => { Object.assign(state, {field:'', topic:'', q:'', decade:'', course:'', shown:100}); $('q').value=''; $('decade').value=''; $('course').value=''; renderAll(); };
  $('random').onclick = () => { const r = filtered(); if (r.length) openPdf(r[Math.floor(Math.random()*r.length)]); };
  $('mclose').onclick = () => { $('modal').classList.remove('open'); $('mframe').src = 'about:blank'; };
  $('modal').addEventListener('click', e => { if (e.target === $('modal')) $('mclose').click(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') $('mclose').click(); });
  renderAll();
})();
</script>
</body>
</html>
